<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wes Filter</title>
<style>
  :root {
    --bg: #0f0f12;

    --border: #2e2e3a;
    --text: #f0f0f5;
    --muted: #9a9aa8;
    --accent: #7c6af7;
    --accent-hover: #9b8cff;
    --success: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1.25rem 1.5rem 0.75rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0.25rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .controls {
    padding: 0.75rem 1.5rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  label { font-size: 0.85rem; color: var(--muted); }
  select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    min-width: 180px;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 1rem 1.25rem 2rem;
    gap: 1rem;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 180px;
  }
  .panel-header {
    padding: 0.6rem 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  textarea, .output {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 1rem;
    font-size: 1.05rem;
    line-height: 1.5;
    resize: none;
    font-family: inherit;
  }
  textarea:focus { outline: none; }
  .output {
    white-space: pre-wrap;
    overflow-y: auto;
    color: #e8e8f0;
  }
  .output:empty::before {
    content: "Wes is waiting...";
    color: var(--muted);
    font-style: italic;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.55rem 1.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
  }
  button.secondary:hover { background: #252530; }
  button.copied { background: var(--success); }
  footer {
    text-align: center;
    padding: 0.75rem;
    font-size: 0.75rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  @media (min-width: 700px) {
    .app { flex-direction: row; }
    .panel { min-height: 320px; }
  }
</style>
</head>
<body>
<header>
  <h1>Wes Filter</h1>
  <p>Type what you really mean. Get what you can actually say.</p>
</header>

<div class="controls">
  <label for="mode">Wes Mode:</label>
  <select id="mode">
    <option value="mild">Mild Wes</option>
    <option value="full" selected>Full Wes</option>
    <option value="sarcastic">Sarcastic Wes</option>
    <option value="corporate">Corporate Wes</option>
    <option value="caffeine">Caffeine Wes</option>
    <option value="minimal">Minimal Wes</option>
  </select>
  <button id="translateBtn">Filter It</button>
</div>

<div class="app">
  <div class="panel">
    <div class="panel-header">What you really want to say</div>
    <textarea id="input" placeholder="Type the unfiltered version here..." autofocus></textarea>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span>Wes says</span>
      <button id="copyBtn" class="secondary">Copy</button>
    </div>
    <div id="output" class="output"></div>
  </div>
</div>

<footer>A gag app. The real Wes still has better judgment than this.</footer>

    /\bhow (?:are|is) (?:you|he|she) still (?:employed|working here)\b/,
    /\bhow do(?:es)? (?:you|he|she) still have a job\b/,
    /\byou had (?:one|1) job\b/,
    /\b(?:you|he|she|they) (?:can't|couldn't) (?:even )?do (?:this|that|it|anything) right\b/,
    /\b(?:can't|couldn't) you (?:even )?do (?:this|that|it|anything) right\b/,
    /\bwho hired (?:you|him|her|this)\b/,
    /\b(?:you're|he's|she's|they're) (?:bad|terrible|awful|useless|hopeless) at\b/,
    /\b(?:you|he|she|they) (?:messed|screwed|fucked) (?:this|that|it|everything) up\b/,
    /\b(?:you|he|she|they) ruined\b/
  ]],
  ["meeting", [
    /\b(?:meeting|call|zoom)\b.{0,20}?(?:\b(?:is|was)|'s) (?:a )?(?:waste|pointless|useless|stupid|dumb|boring|too long)\b/,
    /\b(?:meeting|call|zoom) sucks\b/,
    [/\bwaste of (?:my |our |everyone's |everybody's )?time\b/, /(?:\bnot|n't) (?:a )?waste of\b/],
    /\bcould(?:'ve| have) been an email\b/,
    /\bi (?:hate|can't stand) (?:this|these) (?:meetings?|calls?)\b/
  ]],
  ["impatience", [
    /\bhurry (?:(?:the (?:hell|fuck)|it|this|that) )?up\b/,
    /\b(?:what's|what is) taking (?:you )?(?:long|forever)\b/,
    /\b(?:is|this is|it's|you're) taking forever\b/,
    /\b(?:are you done yet|any day now|get on with it|speed it up|don't have all day)\b/,
    /\bi (?:hate|can't stand|'m tired of) waiting\b/,
    /\b(?:i|we)(?:'ve| have) been waiting (?:forever|for)\b/
  ]],
  ["boundary", [
    /\b(?:mind your own|none of your) (?:damn )?business\b/,
    /\b(?:get off my back|stay out of (?:it|this|my \w+))\b/,
    rx(LEAD + "back off\\b"),
    /\bstop (?:micromanaging|bothering me|hovering)\b/,
    /\bnobody asked\b/,
    /\bleave my \w+ alone\b/,
    /\bdidn't ask (?:for )?(?:you|your (?:opinion|advice))\b/
  ]],
  ["badIdea", [
    [rx("\\b" + NEG + " " + NOUN + "\\b"), rx("\\bnot (?:a |an )?" + NEG + " " + NOUN)],
    rx("\\b" + NOUN + "(?: is|'s| was| sounds| seems) (?:a |an )?(?:" + NEG + "|joke)\\b"),
    rx("\\b" + NOUN + " (?:sucks|stinks)\\b"),
    rx("(?:\\bnot|n't) (?:a |the )?(?:good|great|best|smart) " + NOUN + "\\b"),
    rx("\\b" + NOUN + "(?: is not| isn't|'s not| wasn't) (?:very )?(?:good|great|smart)\\b"),
    rx("\\bi (?:hate|don't like|can't stand|don't love) (?:this|that|your|the|his|her|their) (?:new )?" + NOUN + "\\b")
  ]],
  ["food", [
    rx("\\b(?:food|meal|restaurant|place|dinner|lunch|breakfast|coffee|dish|pizza|burger)\\b.{0,15}?(?:(?:\\b(?:is|was|tastes|tasted|smells)|'s) (?:like )?(?:" + NEG + "|gross|disgusting|nasty)\\b|\\bsuck(?:s|ed)\\b)"),
    rx("\\b(?:this|it) (?:tastes|tasted|smells) (?:like )?(?:" + NEG + "|gross|disgusting|nasty)\\b")
  ]],
  ["insult", [
    rx("\\b(?:you|you're|you look|you sound|he's|she's|they're|he is|she is|they are) (?:a |an |such a |such an |being )?" + INS + "\\b"),
    rx("\\b(?:what an?|bunch of) (?:idiots?|morons?|jerks?|assholes?|losers?)\\b"),
    /^(?:you )?(?:idiot|moron|dumbass|asshole)s?$/,
    /\byou (?:absolute |total |complete )?(?:clown|muppet|donkey)\b/
  ]],
  ["indifferent", [
    /\bi (?:don't|do not) care\b(?! for)/,
    /\bcouldn't care less\b/,
    /\bdon't give a (?:shit|damn|fuck|crap)\b/,
    /\b(?:doesn't matter|who cares|not my problem)\b/,
    /^(?:ok |okay |yeah |eh )?whatever$/
  ]],
  ["refusal", [
    /\b(?:not a chance|hell no|over my dead body|fat chance|i refuse|out of your mind)\b/,
    /\b(?:not happening|no way in hell|no way am i|no way i'm)\b/,
    /^(?:no way|absolutely not|forget it)$/,
    /\b(?:i'm not|i am not|i won't|i will not) (?:doing|do) (?:that|this|it)\b/
  ]],
  ["disagree", [
    /\b(?:you're|that's|this is|it's) (?:wrong|stupid|dumb|ridiculous|nonsense|false|bullshit|bs|not (?:right|true|correct))\b/,
    /\byou're full of (?:shit|it|crap)\b/,
    /\bi disagree\b/,
    /\b(?:makes no sense|doesn't make (?:any )?sense)\b/,
    /\bdon't know what you're talking about\b/,
    /^bullshit$/
  ]],
  ["dislike", [
    /\bi (?:hate|can't stand|despise|loathe|don't like|don't love|don't care for) (?!to say)\w+/,
    /\bi'm (?:sick|tired) of \w+/,
    /\b(?:this|that|it) (?:sucks|stinks)\b/,
    rx("\\b(?:this|that|it)(?: is|'s| was) (?:" + NEG + "|boring|not (?:good|great))\\b")
  ]],
  ["compliment", [
    /\bnot (?:a )?bad\b/,
    rx("\\b(?:you're|you are|you were|you look|that's|this is|it's|that was|it was) (?:a |an )?" + POS + "\\b"),
    [rx("^(?!(?:is|are|was|would|do|does|did|can|could|should|if|how is)\\b).*\\b" + POS + " (?:job|work|idea|call|plan|point)\\b"),
     rx("(?:\\bnot|n't|\\bno) (?:a |an )?" + POS + " (?:job|work|idea|call|plan|point)\\b")],
    rx("\\b(?:your|that|this|the) (?:idea|plan|work|food|meal) (?:is|was) " + POS + "\\b"),
    /\bi (?:love|loved|like|liked) (?:you|this|that|it|your)\b/,
    /^(?:love it|well done|way to go)\b/
  ]],
  ["frustrated", [
    /\b(?:fuck\w*|shit\w*|wtf|what the hell|bullshit|damn it|dammit|crap|are you kidding)\b/
  ]]
];

// Sarcasm that only shows across the whole message, e.g. "Oh great, another meeting".
const IRONIC = [
  /^(?:oh|ah|well)[ ,]+(?:great|wonderful|fantastic|perfect|awesome|lovely|joy)\b(?! (?:job|work|idea))/,
  /\b(?:great|perfect|wonderful|fantastic|awesome|lovely)[ ,.!]+(?:now (?:it|it's|we|i|this)|another|just what)\b/,
  /\bi (?:just )?love how\b.*\b(?:ruined|broke|broken|messed|screwed|forgot|never|nobody)\b/,
  /\b(?:thanks for nothing|just what i needed|love to see you try)\b/
];

// Clauses that report or deny a remark instead of making it.
const NOT_MINE = /\b(?:never said|didn't say|not saying|not calling|(?:told|asked) (?:me|us|him|her|them) to)\b/;

// Two of these in one message get answered together.
const COMPLAINTS = ["silence", "excuses", "workload", "repeated", "incompetence", "meeting", "impatience", "boundary", "badIdea", "food", "insult", "disagree", "dislike"];

const SELF_HARM = /\b(?:kill(?:ing)? myself|end(?:ing)? my (?:own )?life|hurt(?:ing)? myself|i (?:want|need) to die|don't want to (?:live|be alive)|i'm suicidal)\b/;

// Lowercase, straighten phone-keyboard apostrophes, and expand common shortcuts.
function normalize(text) {
  return text.toLowerCase()
    .replace(/[‘’ʼ′`´]/g, "'")
    .replace(/\bdont\b/g, "don't")
    .replace(/\bcant\b/g, "can't")
    .replace(/\bdoesnt\b/g, "doesn't")
    .replace(/\bisnt\b/g, "isn't")
    .replace(/\byoure\b/g, "you're")
    .replace(/\bthats\b/g, "that's")
    .replace(/\bim\b/g, "i'm")
    .replace(/\bwanna\b/g, "want to")
    .replace(/\byou are\b/g, "you're")
    .replace(/\bthat is\b/g, "that's")
    .replace(/\bdo not\b/g, "don't")
    .replace(/[^\S\n]+/g, " ");
}

const hits = (rule, clause) =>
  Array.isArray(rule) ? rule[0].test(clause) && !rule[1].test(clause) : rule.test(clause);

function toClauses(text) {
  // Drop filler words so "you did a fucking amazing job" still reads as praise.
  return text
    .replace(/\b(?:fucking|fuckin|freaking|frickin|goddamn|really|very|totally|absolutely(?! not)|completely|literally|actually|just|so|pretty)\b/g, "")
    .split(/[.!?,;:\n]+|\bbut\b|\bhowever\b| and (?=(?:you|you're|your|this|that|i|i'm) )/)
    .map((c) => c.replace(/\s+/g, " ").trim())
    .filter((c) => c && !NOT_MINE.test(c));
}

function categoryOf(clause) {
  const rule = RULES.find(([, patterns]) => patterns.some((p) => hits(p, clause)));
  return rule ? rule[0] : null;
}

// Returns one category, or two when the message holds two separate complaints.
function detect(original) {
  const text = normalize(original);
  if (SELF_HARM.test(text)) return ["serious"];

  const order = RULES.map(([name]) => name);
  const found = [...new Set(toClauses(text).map(categoryOf).filter(Boolean))]
    .sort((a, b) => order.indexOf(a) - order.indexOf(b));

  // Direct hostility outranks sarcasm; sarcasm outranks everything else.
  const hostile = ["brushoff", "silence", "insult"].some((c) => found.includes(c));
  if (!hostile && IRONIC.some((p) => p.test(text.trim()))) return ["ironic"];

  // "I like it, but ..." is praise with a reservation, not plain praise.
  if (found[0] === "compliment") {
    const parts = text.split(/\bbut\b|\bhowever\b/);
    const later = toClauses(parts.slice(1).join(" "));
    if (parts.length > 1 && later.length && !later.some((c) => categoryOf(c) === "compliment")) return ["mixed"];
  }

  if (!found.length) return ["fallback"];
  const complaints = found.filter((c) => COMPLAINTS.includes(c));
  if (COMPLAINTS.includes(found[0]) && complaints.length > 1) return complaints.slice(0, 2);
  return [found[0]];
}

const lastReply = {};

function pick(category, mode) {
  const lines = REPLIES[category][mode] || REPLIES[category].full;
  const fresh = lines.filter((line) => line !== lastReply[category]);
  lastReply[category] = fresh[Math.floor(Math.random() * fresh.length)];
  return lastReply[category];
}

function rephrase(original, mode) {
  if (!original.trim()) return "";
  const found = detect(original);
  if (found[0] === "serious") return SERIOUS;
  // Minimal Wes only ever answers one thing.
  return found.slice(0, mode === "minimal" ? 1 : 2).map((c) => pick(c, mode)).join(" ");
}

function translate() {
  output.textContent = rephrase(input.value, modeSelect.value);
}

translateBtn.addEventListener("click", translate);
modeSelect.addEventListener("change", () => { if (input.value.trim()) translate(); });

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    translate();
  }
});

// Fallback for browsers that block the modern clipboard API.
function legacyCopy(text) {
  const box = document.createElement("textarea");
  box.value = text;
  box.setAttribute("readonly", "");
  box.style.position = "fixed";
  box.style.opacity = "0";
  document.body.appendChild(box);
  box.select();
  box.setSelectionRange(0, text.length);
  const ok = document.execCommand("copy");
  box.remove();
  return ok;
}

let copyTimer;

copyBtn.addEventListener("click", async () => {
  const text = output.textContent;
  if (!text) return;
  let ok = true;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    ok = legacyCopy(text);
  }
  copyBtn.textContent = ok ? "Copied!" : "Copy failed";
  copyBtn.classList.toggle("copied", ok);
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => {
    copyBtn.textContent = "Copy";
    copyBtn.classList.remove("copied");
  }, 1500);
});
</script>
</body>
