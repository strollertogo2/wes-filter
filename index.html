<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wes Filter</title>
<style>
  :root {
    --bg: #0f0f12;
    --surface: #1a1a22;
    --border: #2e2e3a;
    --text: #f0f0f5;
    --muted: #9a9aa8;
    --accent: #7c6af7;
    --accent-hover: #9b8cff;
    --success: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1.25rem 1.5rem 0.75rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0.25rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .controls {
    padding: 0.75rem 1.5rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  label { font-size: 0.85rem; color: var(--muted); }
  select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    min-width: 180px;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 1rem 1.25rem 2rem;
    gap: 1rem;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 180px;
  }
  .panel-header {
    padding: 0.6rem 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  textarea, .output {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 1rem;
    font-size: 1.05rem;
    line-height: 1.5;
    resize: none;
    font-family: inherit;
  }
  textarea:focus { outline: none; }
  .output {
    white-space: pre-wrap;
    overflow-y: auto;
    color: #e8e8f0;
  }
  .output:empty::before {
    content: "Wes is waiting...";
    color: var(--muted);
    font-style: italic;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.55rem 1.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
  }
  button.secondary:hover { background: #252530; }
  button.copied { background: var(--success); }
  footer {
    text-align: center;
    padding: 0.75rem;
    font-size: 0.75rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  @media (min-width: 700px) {
    .app { flex-direction: row; }
    .panel { min-height: 320px; }
  }
</style>
</head>
<body>
<header>
  <h1>Wes Filter</h1>
  <p>Type what you really mean. Get what you can actually say.</p>
</header>

<div class="controls">
  <label for="mode">Wes Mode:</label>
  <select id="mode">
    <option value="mild">Mild Wes</option>
    <option value="full" selected>Full Wes</option>
    <option value="sarcastic">Sarcastic Wes</option>
    <option value="corporate">Corporate Wes</option>
    <option value="caffeine">Caffeine Wes</option>
    <option value="minimal">Minimal Wes</option>
  </select>
  <button id="translateBtn">Filter It</button>
</div>

<div class="app">
  <div class="panel">
    <div class="panel-header">What you really want to say</div>
    <textarea id="input" placeholder="Type the unfiltered version here..." autofocus></textarea>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span>Wes says</span>
      <button id="copyBtn" class="secondary">Copy</button>
    </div>
    <div id="output" class="output"></div>
  </div>
</div>

<footer>A gag app. The real Wes still has better judgment than this.</footer>

<script>

const output = document.getElementById('output');
const modeSelect = document.getElementById('mode');
const translateBtn = document.getElementById('translateBtn');
const copyBtn = document.getElementById('copyBtn');

// ===== Wes's lines. Edit these to make him sound like the real Wes. =====

    full: ["I have some concerns about that direction. Mind if we look at a couple alternatives?", "Can we pressure-test that before we commit?", "I see where you're headed, but I'd like to weigh another option."],
    sarcastic: ["That's one way to do it. Bold choice.", "What a brave thing to say out loud.", "Let's file that one somewhere very safe and far away."],
    corporate: ["I'd like to explore options that better align with our objectives.", "Let's park that and evaluate alternatives.", "I'm not sure we have buy-in on that approach yet."],
    caffeine: ["Nope, don't think that works! Next idea!", "Ooh, pass! What else have we got?", "Let's brainstorm again, fast!"],

  },
  food: {
    mild: ["It's not really my thing.", "It's a little different from what I expected.", "I think I'm good for now."],
    full: ["I'm not the biggest fan of this one.", "I might try somewhere else next time.", "It's not my favorite, but I appreciate the pick."],
    sarcastic: ["Interesting texture. Very... intentional.", "You can really taste the decisions.", "I'll be thinking about this meal for all the wrong reasons."],
    corporate: ["The experience doesn't fully align with my preferences.", "I see room for improvement in the culinary deliverables.", "I'd suggest we evaluate other vendors for lunch."],

  },

    sarcastic: ["Sure. Whatever you think is best. Obviously.", "I'm on the edge of my seat, either way.", "Surprise me. I can barely contain myself."],
    corporate: ["I'm aligned with the group's preference here.", "I'll support whichever direction the team selects.", "No objections from my side."],

  },
  disagree: {

    sarcastic: ["Interesting perspective. Not the one I have, but interesting.", "Fascinating. Where did you find that one?", "I love how sure you sound."],
    corporate: ["I'd like to offer an alternative viewpoint for consideration.", "Let's validate that assumption before proceeding.", "My data points in a slightly different direction."],
    caffeine: ["Hmm, nope, don't think so!", "Wait, what? Let's double-check that!", "Gonna push back on that one!"],

  },
  dislike: {

    corporate: ["This doesn't fully align with my preferences.", "I have some reservations I'd like to note.", "I'd welcome the chance to explore other options."],
    caffeine: ["Yeah, not into it!", "Hard pass! Friendly pass, but hard!", "Can we do literally anything else?"],
    minimal: ["Not my thing.", "Pass.", "Meh."]
  },
  compliment: {
    mild: ["That's nice.", "Good stuff.", "I like where that landed."],
    full: ["Really nice work. I appreciate it.", "That turned out great. Well done.", "I'm impressed. Thanks for putting that in."],
    sarcastic: ["Look at you, being all competent.", "Great. Now we'll all expect this every time.", "I'm not crying. You're just doing well."],
    corporate: ["Excellent contribution. This adds real value.", "Strong deliverable. Thank you for your efforts.", "I'd like to recognize the quality of this work."],
    caffeine: ["Yes!! Love it!!", "Amazing! High five! Both hands!", "Nailed it! Do it again!"],
    minimal: ["Nice.", "Good work.", "Solid."]
  },
  frustrated: {
    mild: ["I'm a bit confused by this.", "Well, that's unexpected.", "Give me a second with this one."],
    full: ["Can you help me understand what's going on here?", "This is a frustrating one. Can we work through it?", "I need a minute, then let's figure it out."],
    sarcastic: ["That's certainly one way for things to go.", "Oh good. This again.", "Couldn't have planned it better myself."],
    corporate: ["I'd like to flag a challenge we've encountered.", "This presents a learning opportunity.", "Let's escalate this appropriately."],
    caffeine: ["What is happening?! Okay! Fixing it!", "Nope nope nope! Regroup!", "I'm fine! Totally fine! Mostly!"],
    minimal: ["Oh boy.", "Not ideal.", "Hm."]
  },
  fallback: {
    mild: ["Let me think about that.", "That's something to consider.", "I hear you.", "Could be."],
    full: ["That's a fair thing to bring up. Let me give it some thought.", "I appreciate you sharing that.", "Good to know. Can we come back to it?", "I can see why that's on your mind."],
    sarcastic: ["Wow. Tell me absolutely everything.", "And you came to me with this. I'm honored.", "Noted, in my finest imaginary notebook.", "What a time to be alive."],
    corporate: ["Thank you for surfacing that.", "Let's circle back on this.", "I'll take that under advisement.", "Noted. I'll follow up as appropriate."],
    caffeine: ["Yep! Got it! Moving!", "Love it, noted, next!", "Okay! Cool! What else?", "Sure thing! Zoom zoom!"],
    minimal: ["Noted.", "Got it.", "Okay.", "Sure."]
  }
};

// Shown instead of a joke if the text sounds like real self-harm.
const SERIOUS = "No joke for this one. If you're thinking about hurting yourself, call or text 988 (US) or reach out to someone you trust right now.";

// ===== Matching rules =====
const NEG = "(?:idiotic|stupid|dumb|moronic|garbage|trash|shit|shitty|terrible|awful|horrible|bad|worst|ridiculous|crap|crappy|pointless|useless|lousy)";
const NOUN = "(?:idea|suggestion|plan|take|approach|proposal)";
const POS = "(?:great|amazing|awesome|excellent|fantastic|good|nice|brilliant|perfect|wonderful|incredible|outstanding)";
const INS = "(?:idiots?|morons?|dumbass(?:es)?|stupid|dumb|jerks?|assholes?|useless|annoying|ridiculous|clueless|incompetent|losers?|the worst)";
const LEAD = "^(?:(?:please|oh|hey|ok|okay|now|seriously|dude|man|bro|and|can you|could you|will you|would you|why don't you|you can|you should|you need to|go ahead and) )*";

const rx = (source) => new RegExp(source);

// Checked top to bottom. The first category that matches any part of the text wins.
const RULES = [
  ["brushoff", [
    rx(LEAD + "(?:go away|get lost|fuck off|piss off|screw you|fuck you|leave me alone|go die|drop dead|kill yourself|disappear)\\b"),
    rx(LEAD + "get out(?: of (?:here|my \\w+))?(?: now| please)?$"),
    /\bi (?:wish|hope) you(?:'d| would| will)? (?:disappear|die|leave|go away)\b/
  ]],
  ["silence", [
    rx(LEAD + "(?:shut up(?! and take)|shut it|stop talking|stop interrupting|be quiet|zip it|let me (?:talk|speak|finish))\\b"),
    rx(LEAD + "quiet(?: down)?(?: please)?$"),
    /\byou talk too much\b/
  ]],
  ["meeting", [
    /\b(?:meeting|call|zoom)\b.{0,20}?(?:\b(?:is|was)|'s) (?:a )?(?:waste|pointless|useless|stupid|dumb|boring|too long)\b/,
    /\b(?:meeting|call|zoom) sucks\b/,
    /(?<!(?:not|n't) (?:a )?)\bwaste of (?:my |our |everyone's |everybody's )?time\b/,
    /\bcould(?:'ve| have) been an email\b/,
    /\bi (?:hate|can't stand) (?:this|these) (?:meetings?|calls?)\b/
  ]],
  ["insult", [
    rx("\\b(?:you|you're|you look|you sound|he's|she's|they're|he is|she is|they are) (?:a |an |such a |such an |being )?" + INS + "\\b"),
    rx("\\b(?:what an?|bunch of) (?:idiots?|morons?|jerks?|assholes?|losers?)\\b"),
    /^(?:you )?(?:idiot|moron|dumbass|asshole)s?$/
  ]],
  ["badIdea", [
    rx("(?<!not (?:a |an )?)\\b" + NEG + " " + NOUN + "\\b"),
    rx("\\b" + NOUN + "(?: is|'s| was| sounds| seems) (?:a |an )?(?:" + NEG + "|joke)\\b"),
    rx("\\b" + NOUN + " (?:sucks|stinks)\\b"),
    rx("(?:\\bnot|n't) (?:a |the )?(?:good|great|best|smart) " + NOUN + "\\b"),
    rx("\\b" + NOUN + "(?: is not| isn't|'s not| wasn't) (?:very )?(?:good|great|smart)\\b"),
    rx("\\bi (?:hate|don't like|can't stand|don't love) (?:this|that|your|the|his|her|their) (?:new )?" + NOUN + "\\b")
  ]],
  ["food", [
    rx("\\b(?:food|meal|restaurant|place|dinner|lunch|breakfast|coffee|dish|pizza|burger)\\b.{0,15}?(?:(?:\\b(?:is|was|tastes|tasted|smells)|'s) (?:like )?(?:" + NEG + "|gross|disgusting|nasty)\\b|\\bsuck(?:s|ed)\\b)"),
    rx("\\b(?:this|it) (?:tastes|tasted|smells) (?:like )?(?:" + NEG + "|gross|disgusting|nasty)\\b")
  ]],
  ["indifferent", [
    /\bi (?:don't|do not) care\b(?! for)/,
    /\bcouldn't care less\b/,
    /\bdon't give a (?:shit|damn|fuck|crap)\b/,
    /\b(?:doesn't matter|who cares|not my problem)\b/,
    /^(?:ok |okay |yeah |eh )?whatever$/
  ]],
  ["disagree", [
    /\b(?:you're|that's|this is|it's) (?:wrong|stupid|dumb|ridiculous|nonsense|bullshit|bs|not (?:right|true|correct))\b/,
    /\bi disagree\b/,
    /\b(?:makes no sense|doesn't make (?:any )?sense)\b/,
    /\bdon't know what you're talking about\b/,
    /^bullshit$/
  ]],
  ["dislike", [
    /\bi (?:hate|can't stand|despise|loathe|don't like|don't love|don't care for) \w+/,
    /\bi'm (?:sick|tired) of \w+/,
    /\b(?:this|that|it) (?:sucks|stinks)\b/,
    rx("\\b(?:this|that|it)(?: is|'s| was) (?:" + NEG + "|boring|not (?:good|great))\\b")
  ]],
  ["compliment", [
    /\bnot (?:a )?bad\b/,
    rx("\\b(?:you're|you are|you were|you look|that's|this is|it's|that was|it was) (?:a |an )?" + POS + "\\b"),
    rx("^(?!(?:is|are|was|would|do|does|did|can|could|should|if|how is)\\b).*?(?<!(?:\\bnot|n't|\\bno) (?:a |an )?)\\b" + POS + " (?:job|work|idea|call|plan|point)\\b"),
    rx("\\b(?:your|that|this|the) (?:idea|plan|work|food|meal) (?:is|was) " + POS + "\\b"),
    /\bi (?:love|loved|like|liked) (?:you|this|that|it|your)\b/,
    /^(?:love it|well done|way to go)\b/
  ]],
  ["frustrated", [
    /\b(?:fuck\w*|shit\w*|wtf|what the hell|bullshit|damn it|dammit|crap|are you kidding)\b/
  ]]
];

const SELF_HARM = /\b(?:kill(?:ing)? myself|end(?:ing)? my (?:own )?life|hurt(?:ing)? myself|i (?:want|need) to die|don't want to (?:live|be alive)|i'm suicidal)\b/;

// Lowercase, straighten phone-keyboard apostrophes, and expand common shortcuts.
function normalize(text) {
  return text.toLowerCase()
    .replace(/[‘’ʼ′`´]/g, "'")
    .replace(/\bdont\b/g, "don't")
    .replace(/\bcant\b/g, "can't")
    .replace(/\bdoesnt\b/g, "doesn't")
    .replace(/\bisnt\b/g, "isn't")
    .replace(/\byoure\b/g, "you're")
    .replace(/\bthats\b/g, "that's")
    .replace(/\bim\b/g, "i'm")
    .replace(/\bwanna\b/g, "want to")
    .replace(/\byou are\b/g, "you're")
    .replace(/\bthat is\b/g, "that's")
    .replace(/\bdo not\b/g, "don't")
    .replace(/[^\S\n]+/g, " ");
}

function classify(original) {
  const text = normalize(original);
  if (SELF_HARM.test(text)) return "serious";

  // Drop filler words so "you did a fucking amazing job" still reads as praise.
  const clauses = text
    .replace(/\b(?:fucking|fuckin|freaking|frickin|goddamn|really|very|totally|absolutely|completely|literally|actually|just|so|pretty)\b/g, "")
    .split(/[.!?,;:\n]+|\bbut\b/)
    .map((c) => c.replace(/\s+/g, " ").trim())
    .filter(Boolean);

  for (const [category, patterns] of RULES) {
    if (clauses.some((c) => patterns.some((p) => p.test(c)))) return category;
  }
  return "fallback";
}

let lastReply = "";

function rephrase(original, mode) {
  if (!original.trim()) return "";
  const category = classify(original);
  if (category === "serious") return SERIOUS;
  const lines = REPLIES[category][mode] || REPLIES[category].full;
  const fresh = lines.filter((line) => line !== lastReply);
  lastReply = fresh[Math.floor(Math.random() * fresh.length)];
  return lastReply;
}

function translate() {
  output.textContent = rephrase(input.value, modeSelect.value);
}

translateBtn.addEventListener("click", translate);
modeSelect.addEventListener("change", () => { if (input.value.trim()) translate(); });

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    translate();
  }
});

// Fallback for browsers that block the modern clipboard API.
function legacyCopy(text) {
  const box = document.createElement("textarea");
  box.value = text;
  box.setAttribute("readonly", "");
  box.style.position = "fixed";
  box.style.opacity = "0";
  document.body.appendChild(box);
  box.select();
  box.setSelectionRange(0, text.length);
  const ok = document.execCommand("copy");
  box.remove();
  return ok;
}

let copyTimer;

copyBtn.addEventListener("click", async () => {
  const text = output.textContent;
  if (!text) return;
  let ok = true;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    ok = legacyCopy(text);
  }
  copyBtn.textContent = ok ? "Copied!" : "Copy failed";
  copyBtn.classList.toggle("copied", ok);
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => {
    copyBtn.textContent = "Copy";
    copyBtn.classList.remove("copied");
  }, 1500);
});
</script>
</body>
