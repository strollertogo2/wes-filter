<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wes Filter</title>
<style>
  :root {
    --bg: #0f0f12;
    --surface: #1a1a22;
    --border: #2e2e3a;
    --text: #f0f0f5;
    --muted: #9a9aa8;
    --accent: #7c6af7;
    --accent-hover: #9b8cff;
    --success: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1.25rem 1.5rem 0.75rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0.25rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .controls {
    padding: 0.75rem 1.5rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  label { font-size: 0.85rem; color: var(--muted); }
  select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    min-width: 180px;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 1rem 1.25rem 2rem;
    gap: 1rem;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 180px;
  }
  .panel-header {
    padding: 0.6rem 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  textarea, .output {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 1rem;
    font-size: 1.05rem;
    line-height: 1.5;
    resize: none;
    font-family: inherit;
  }
  textarea:focus { outline: none; }
  .output {
    white-space: pre-wrap;
    overflow-y: auto;
    color: #e8e8f0;
  }
  .output:empty::before {
    content: "Wes is waiting...";
    color: var(--muted);
    font-style: italic;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.55rem 1.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
  }
  button.secondary:hover { background: #252530; }
  button.copied { background: var(--success); }
  footer {
    text-align: center;
    padding: 0.75rem;
    font-size: 0.75rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  @media (min-width: 700px) {
    .app { flex-direction: row; }
    .panel { min-height: 320px; }
  }
</style>
</head>
<body>
<header>
  <h1>Wes Filter</h1>
  <p>Type what you really mean. Get what you can actually say.</p>
</header>

<div class="controls">
  <label for="mode">Wes Mode:</label>
  <select id="mode">
    <option value="mild">Mild Wes</option>
    <option value="full" selected>Full Wes</option>
    <option value="sarcastic">Sarcastic Wes</option>
    <option value="corporate">Corporate Wes</option>
    <option value="caffeine">Caffeine Wes</option>
    <option value="minimal">Minimal Wes</option>
  </select>
  <button id="translateBtn">Filter It</button>
</div>

<div class="app">
  <div class="panel">
    <div class="panel-header">What you really want to say</div>
    <textarea id="input" placeholder="Type the unfiltered version here..." autofocus></textarea>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span>Wes says</span>
      <button id="copyBtn" class="secondary">Copy</button>
    </div>
    <div id="output" class="output"></div>
  </div>
</div>

<footer>A gag app. The real Wes still has better judgment than this.</footer>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const modeSelect = document.getElementById('mode');
const translateBtn = document.getElementById('translateBtn');
const copyBtn = document.getElementById('copyBtn');

function rephrase(original, mode) {
  const text = original.trim();
  if (!text) return '';
  const lower = text.toLowerCase();

  // Profanity / strong frustration
  if (/\b(what the fuck|what the hell|wtf|are you fucking|the fuck|fucking)\b/.test(lower)) {
    return pick(mode, {
      mild: "I'm not sure I follow.",
      full: "Can you help me understand what you mean?",
      sarcastic: "That's certainly one way to put it.",
      corporate: "I'd like to clarify the intent here.",
      caffeine: "I'm confused. What are we doing?",
      minimal: "Not following."
    });
  }

  if (/\bfuck\b/.test(lower)) {
    return pick(mode, {
      mild: "This is frustrating.",
      full: "I'm finding this difficult.",
      sarcastic: "Well this is going great.",
      corporate: "This presents some challenges.",
      caffeine: "This is not going well.",
      minimal: "This is rough."
    });
  }

  // Strong patterns
  if (/\b(disappear|go away|fuck off|get lost|leave me alone|shut up|die)\b/.test(lower)) {
    return pick(mode, {
      mild: "I think we should probably wrap this up.",
      full: "I should probably head out. Appreciate the time.",
      sarcastic: "This has been great. We should do it again never.",
      corporate: "I need to step away to address another priority.",
      caffeine: "Yeah I'm done. Peace.",
      minimal: "I should go."
    });
  }

  if (/\b(idiot|stupid|dumb|moron|dumbass) (idea|suggestion|plan)\b/.test(lower) ||
      /\b(idea|suggestion) is (idiot|stupid|dumb|garbage|shit)\b/.test(lower)) {
    return pick(mode, {
      mild: "I'm not sure that approach is going to work.",
      full: "I have some concerns about that direction. Can we look at alternatives?",
      sarcastic: "That's certainly a creative approach. Very creative.",
      corporate: "I'd like to explore other options that might better align with our objectives.",
      caffeine: "I don't think that idea works.",
      minimal: "Not sure about that idea."
    });
  }

  if (/\b(meeting|call) is (a )?(waste|pointless|useless|stupid)\b/.test(lower)) {
    return pick(mode, {
      mild: "I think we could tighten this up a bit.",
      full: "Should we check if we can cover the key points more efficiently?",
      sarcastic: "This is clearly the most productive use of everyone's time today.",
      corporate: "I'd like to explore opportunities to optimize our time allocation.",
      caffeine: "Can we just get to the point?",
      minimal: "Can we wrap this faster?"
    });
  }

  if (/\b(i hate|don't like|can't stand)\b/.test(lower)) {
    return pick(mode, {
      mild: "This isn't really my thing.",
      full: "I should probably get going soon.",
      sarcastic: "We should do this again sometime. Or not.",
      corporate: "I need to step away to handle another priority.",
      caffeine: "Yeah I'm gonna bounce.",
      minimal: "I should head out."
    });
  }

  if (/\b(shut up|stop talking|let me talk|let me finish)\b/.test(lower)) {
    return pick(mode, {
      mild: "Can I jump in with one thing?",
      full: "I'd like to add a quick thought before we move on.",
      sarcastic: "Sorry, I just have one tiny point.",
      corporate: "If I may, I'd like to contribute a perspective.",
      caffeine: "Hold on, I need to say something.",
      minimal: "Quick thought?"
    });
  }

  // Generic softening
  let result = text;
  result = result.replace(/\bhate\b/gi, "don't love");
  result = result.replace(/\bstupid\b|\bdumb\b|\bidiot\b/gi, "not ideal");
  result = result.replace(/\bterrible\b|\bawful\b|\bhorrible\b/gi, "not great");
  result = result.replace(/\bsucks\b|\bgarbage\b|\bshit\b/gi, "isn't great");
  result = result.replace(/\bwaste of time\b/gi, "could be more efficient");

  if (mode === "full") result = "I see what you mean. Maybe we can put it this way: " + result;
  if (mode === "sarcastic") result = "Sure. " + result + " Whatever you say.";
  if (mode === "corporate") result = "From a collaborative standpoint, " + result.toLowerCase();
  if (mode === "caffeine") result = result.replace(/\./g, "!") + "!";
  if (mode === "minimal") {
    const words = result.split(/\s+/);
    result = words.slice(0, Math.min(6, words.length)).join(" ") + (words.length > 6 ? "..." : "");
  }

  result = result.replace(/\s+/g, " ").trim();
  if (!/[.!?]$/.test(result)) result += ".";
  return result.charAt(0).toUpperCase() + result.slice(1);
}

function pick(mode, map) {
  return map[mode] || map.full;
}

function translate() {
  console.log("Filtering...");
  const text = input.value.trim();
  output.textContent = text ? rephrase(text, modeSelect.value) : "";
}

translateBtn.addEventListener("click", translate);
modeSelect.addEventListener("change", () => { if (input.value.trim()) translate(); });

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    translate();
  }
});

copyBtn.addEventListener("click", async () => {
  const text = output.textContent;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    copyBtn.textContent = "Copied!";
    copyBtn.classList.add("copied");
    setTimeout(() => {
      copyBtn.textContent = "Copy";
      copyBtn.classList.remove("copied");
    }, 1500);
  } catch {
    copyBtn.textContent = "Copied!";
  }
});
</script>
</body>
</html>
